name: Check specification site

on:
  pull_request:
    paths:
      - 'README.md'
      - 'metadata.yml'
      - 'authors.yml'
      - 'toc.yml'
      - 'api-references.yml'
      - 'api/**'
      - 'spec/**'
      - 'ADR/**'
      - 'adr/**'
      - 'resources/**'
      - 'specification-site/**'
      - '.github/workflows/specification-site-check.yml'
  push:
    branches:
      - playground-hendrik
  workflow_dispatch:

permissions:
  contents: read

env:
  RENDERER_REPOSITORY: jeremi/govstack-specification-site
  RENDERER_REF: ${{ vars.GOVSTACK_SITE_RENDERER_REF || '567eb981cd0c2a1bb9163b2cecbfc12a1b7412fd' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate the immutable renderer revision
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ ! "$RENDERER_REF" =~ ^[0-9a-f]{40}$ ]]; then
            printf '%s\n' 'GOVSTACK_SITE_RENDERER_REF must be a published full renderer commit.' >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: specification
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.RENDERER_REPOSITORY }}
          ref: ${{ env.RENDERER_REF }}
          path: renderer
          persist-credentials: false
      - name: Require the selected native OpenAPI renderer
        shell: bash
        run: |
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "$(git -C renderer rev-parse HEAD)" != "$RENDERER_REF" ]]; then
            printf '%s\n' 'The checked-out renderer does not match the selected commit.' >&2
            exit 1
          fi
          if [[ ! -f renderer/action.yml || ! -f renderer/scripts/api-references.mjs || ! -f renderer/src/components/ReferenceContent.astro ]]; then
            printf '%s\n' 'The renderer pin lacks native OpenAPI support. Set GOVSTACK_SITE_RENDERER_REF to a published revision containing the Scalar integration and build action.' >&2
            exit 1
          fi
      - name: Set up Node for consumer tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install the shared renderer
        working-directory: renderer
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test the Analytics integration
        working-directory: specification/specification-site
        env:
          GOVSTACK_SITE_RENDERER: ${{ github.workspace }}/renderer
        run: npm test
      - name: Build and verify the specification site
        uses: ./renderer
        with:
          source: specification
          output: ${{ runner.temp }}/site
          base: /${{ github.event.repository.name }}/
          unofficial: 'true'
      - name: Upload the checked review site
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: analytics-specification-site
          path: ${{ runner.temp }}/site
          if-no-files-found: error
          retention-days: 14
